<!DOCTYPE html>

<html class="light" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Álbum Save the Date - Otto &amp; Susy</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@24,400,0&display=swap"
        rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Great+Vibes&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="src/styles.css" />

<body
    class="bg-background-light dark:bg-background-dark font-display text-[#1b130d] dark:text-[#fcfaf8] transition-colors duration-300">
    <!-- Floral Background Accents -->
    <div class="floral-accent top-0 left-0">
        <svg viewbox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <path
                d="M40,-62.7C52.2,-54.5,62.5,-43.9,68.8,-31.4C75.1,-18.9,77.4,-4.5,74.1,8.7C70.8,21.9,61.9,33.9,51.4,44.1C40.9,54.3,28.8,62.7,15.1,67.4C1.4,72.1,-13.9,73.1,-27.6,68.9C-41.3,64.7,-53.4,55.3,-62.2,43.3C-71,31.3,-76.5,16.7,-76.3,2.2C-76.1,-12.3,-70.2,-26.7,-60.8,-38.2C-51.4,-49.7,-38.5,-58.3,-25.4,-65.3C-12.3,-72.3,1,-77.7,14.6,-75.4C28.2,-73.1,40,-62.7,40,-62.7Z"
                fill="currentColor" transform="translate(100 100)"></path>
        </svg>
    </div>
    <div class="floral-accent bottom-0 right-0">
        <svg viewbox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <path
                d="M44.7,-76.4C58.3,-69.2,69.9,-57.4,77.3,-43.7C84.8,-30,88.1,-15,87.6,-0.3C87.1,14.4,82.8,28.8,74.7,41.4C66.7,54,54.8,64.8,41.1,72.1C27.3,79.4,11.7,83.1,-3.2,88.6C-18,94.1,-32.1,101.4,-44.6,97.7C-57.1,94,-68,79.3,-76.2,64.8C-84.4,50.3,-89.9,36,-91.7,21.3C-93.5,6.6,-91.6,-8.6,-86.1,-22.4C-80.5,-36.2,-71.4,-48.6,-59.8,-56.9C-48.2,-65.2,-34.1,-69.4,-20.5,-76.7C-6.9,-84,6.2,-94.4,20.5,-91.4C34.8,-88.4,50.4,-72.1,44.7,-76.4Z"
                fill="currentColor" transform="translate(100 100)"></path>
        </svg>
    </div>
    <div class="relative z-10 layout-container flex min-h-screen flex-col">
        <!-- TopNavBar -->
        <header class="flex items-center justify-between
         border-b border-[#e7d9cf] dark:border-[#3a2c20]
         bg-background-light/80 dark:bg-background-dark/80
         backdrop-blur-md
         px-4 md:px-10
         py-2 md:py-3
         sticky top-0 z-50">

            <!-- Logo -->
            <div class="flex items-center gap-3 text-[#1b130d] dark:text-[#fcfaf8]">
                <span class="material-symbols-outlined text-primary" style="font-size:32px;">
                    photo_album
                </span>
                <h2 class="text-lg font-bold tracking-tight">Álbum</h2>
            </div>

            <!-- Desktop Navigation -->
            <nav class="hidden md:flex flex-1 justify-center gap-8">
                <button onclick="loadGallery('save')"
                    class="nav-link text-primary text-sm font-bold border-b-2 border-primary pb-1" data-folder="save">
                    Save the Date
                </button>

                <button onclick="loadGallery('boda')"
                    class="nav-link text-text-muted dark:text-gray-400 text-sm font-medium hover:text-primary"
                    data-folder="boda">
                    Boda
                </button>

                <button onclick="loadGallery('aniversario')"
                    class="nav-link text-text-muted dark:text-gray-400 text-sm font-medium hover:text-primary"
                    data-folder="aniversario">
                    Aniversario
                </button>

                <button onclick="toggleFavoritesFilter()" id="favoritesBtn"
                    class="nav-link text-text-muted dark:text-gray-400 text-sm font-medium hover:text-primary flex items-center gap-1">
                    <span class="material-symbols-outlined text-base">favorite</span>
                    <span id="favoritesCount">0</span>
                </button>
            </nav>

            <!-- Right Actions -->
            <div class="flex items-center gap-2 md:gap-4">
                <button
                    class="hidden sm:flex h-10 px-4 rounded-lg bg-primary text-white text-sm font-bold hover:bg-primary/90">
                    Compartir
                </button>

                <button class="hidden sm:flex items-center justify-center h-10 w-10 rounded-lg
             bg-accent-tan dark:bg-[#3a2c20]">
                    <span class="material-symbols-outlined">favorite</span>
                </button>

                <button class="hidden sm:flex items-center justify-center h-10 w-10 rounded-lg
             bg-accent-tan dark:bg-[#3a2c20]">
                    <span class="material-symbols-outlined">account_circle</span>
                </button>

                <!-- Mobile Menu Button -->
                <button class="md:hidden flex items-center justify-center h-10 w-10 rounded-lg
             bg-accent-tan dark:bg-[#3a2c20]" onclick="toggleMobileMenu()" aria-label="Abrir menú">
                    <span class="material-symbols-outlined">menu</span>
                </button>
            </div>
        </header>
        <div id="mobileMenu" class="hidden md:hidden
         border-b border-[#e7d9cf] dark:border-[#3a2c20]
         bg-background-light dark:bg-background-dark">

            <nav class="flex flex-col divide-y divide-[#e7d9cf] dark:divide-[#3a2c20]">

                <button onclick="loadGallery('save'); closeMobileMenu()" class="px-6 py-4 text-left font-medium">
                    Save the Date
                </button>

                <button onclick="loadGallery('boda'); closeMobileMenu()" class="px-6 py-4 text-left font-medium">
                    Boda
                </button>

                <button onclick="loadGallery('aniversario'); closeMobileMenu()" class="px-6 py-4 text-left font-medium">
                    Aniversario
                </button>

                <button onclick="toggleFavoritesFilter(); closeMobileMenu()"
                    class="px-6 py-4 text-left font-medium flex items-center gap-2">
                    <span class="material-symbols-outlined">favorite</span>
                    Favoritos
                </button>

            </nav>
        </div>

        <main class="flex-1 max-w-[1200px] mx-auto w-full px-6 py-12">
            <!-- Header Image / Hero Section -->
            <div class="mb-12">
                <div class="bg-cover bg-center flex flex-col justify-center items-center overflow-hidden bg-[#e7d9cf] rounded-xl min-h-[350px] relative"
                    data-alt="Beautiful sunset over the ruins of Antigua Guatemala"
                    style='background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url("https://lh3.googleusercontent.com/aida-public/AB6AXuDXBRu3l1BQqOi7Lkbrq6BxtNiRnsyf7cxb8aq_g_CxOZDln0lCNQtv3SYi71d3SR04J7LwNy5jIZdnIqLScV3pYQSh7gN6Pn6fEXwz_paLw0GQN-ude8xhWSjWoJZE7Hjn9bN4NsfOO5ZhrmQIShgOi77xcTb9ZoHhisw3HUjRdMfCTr19Cw3kT2Lk-jn6JnHP4qd9zomlu6RVUyfHjKBybqZ_LVG0prdrMounzjVUbcL0J-iDEQmsZDvu4NBXeqWGL1Wn4A6FX5N4");'>
                    <h1 class="font-script text-white text-7xl md:text-8xl mb-2 drop-shadow-lg">Otto &amp; Susy</h1>
                    <div class="h-[1px] w-24 bg-white/60 mb-4"></div>
                    <p class="text-white tracking-[0.2em] text-lg font-light uppercase">Antigua Guatemala</p>
                </div>
            </div>
            <!-- Headline and Meta -->
            <div class="text-center mb-16">
                <h2 class="text-4xl font-bold mb-3">Save the Date</h2>
                <p class="text-text-muted dark:text-gray-400 italic text-lg">Enero 2024 — Capturando los momentos antes
                    del "Sí, acepto"</p>
                <div class="flex justify-center mt-6 gap-2">
                    <span class="h-1.5 w-1.5 rounded-full bg-primary/40"></span>
                    <span class="h-1.5 w-1.5 rounded-full bg-primary"></span>
                    <span class="h-1.5 w-1.5 rounded-full bg-primary/40"></span>
                </div>
            </div>
            <!-- Masonry Gallery -->
            <div id="gallery" class="masonry">
                <!-- Las fotos se cargarán dinámicamente aquí -->
            </div>
            <!-- Footer Section -->
            <footer class="mt-20 border-t border-accent-tan dark:border-[#3a2c20] pt-12 pb-8 text-center">
                <div class="font-script text-4xl text-primary mb-4">Otto &amp; Susy</div>
                <p class="text-xs text-gray-400">© 2024 Álbum Digital. Fotografías por Memoria Histórica.</p>
            </footer>
        </main>
    </div>
    <!-- Map Section Sample Component -->
    <div class="hidden">
        <img alt="map" data-location="Antigua Guatemala"
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuAjs3jvtjVcBiHTnH-jPGMXbZeD-_BvBzzKxPsz5GbrNdrFLyumuVaTDYapUFDBUXk0zJ-hDj85-Mpe1Z-gMq6S_n3i_hj1QICPwSP4h2I7ELAA7QwY1_zuFa3oPyejdpfPSmMyfnv1ziipVJ-CbX-aUQXggNTtGsYp5_A_ppIIC2RjCRl6Nkw8R1CzZMs194IVQs6piTNryhjcsQBFf1hml-jFPOOzAea-79m_HbRMs92q6ONupp-_QWJ0L7XSvR8NAySPJN0E63iq" />
    </div>

    <!-- Modal para ampliar fotos -->
    <div id="photoModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <button class="modal-nav modal-prev" onclick="prevPhoto()" title="Anterior">‹</button>
            <img id="modalImage" alt="Foto ampliada" />
            <button class="modal-nav modal-next" onclick="nextPhoto()" title="Siguiente">›</button>
            <button class="modal-download" onclick="downloadPhoto()" title="Descargar">
                <span class="material-symbols-outlined">download</span>
            </button>
            <button class="modal-favorite" onclick="toggleFavorite()" title="Agregar a favoritos">
                <span class="material-symbols-outlined" id="favoriteIcon">favorite_border</span>
            </button>
            <div class="modal-counter">
                <span id="photoCounter">1/1</span>
            </div>
        </div>
    </div>

    <script src="src/app.js"></script>
</body>

</html>
